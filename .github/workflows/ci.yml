name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (CPU-only PyTorch keeps the runner small)
        # uv.lock stays platform-neutral; CI swaps in the CPU wheels after syncing everything else.
        run: |
          uv sync --extra dev --no-install-package torch --no-install-package torchvision
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check src tests scripts examples
      - name: Test
        # Tests use randomly initialised VGG19 weights, so nothing is downloaded.
        run: uv run --no-sync pytest -v
